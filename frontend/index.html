<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf6f1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <title>Письмо для тебя</title>
    <!-- Официальный Telegram Mini Apps SDK. В браузере и как PWA не используется,
         безопасно игнорирует своё отсутствие. Должен идти до остальных скриптов. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PWA: манифест и иконки -->
    <link rel="manifest" href="manifest.json" />
    <!-- ?v=2 сбрасывает кэш иконки на устройстве: iOS сохраняет apple-touch-icon
         по URL и не обновляет его при повторных добавлениях. -->
    <link rel="apple-touch-icon" href="icon-180.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Письмо" />
    <!-- Рукописный шрифт текста письма (сцена 2). display=swap: текст читаем,
         пока шрифт грузится. Caveat поддерживает кириллицу. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
